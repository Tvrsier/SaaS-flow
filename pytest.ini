[pytest]
# Pytest configuration for SaaS-flow
log_cli = true
log_cli_level = DEBUG
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Test paths
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    validator: marks tests that use XSD validation
    generator: marks tests for XML generation
    converter: marks tests for payload conversion

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:multipart
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:python_multipart

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
